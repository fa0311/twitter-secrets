name: twitter-secrets
description: Decrypt the shared X/Twitter credentials (sops + age) and expose them to the job
inputs:
  age-key:
    description: age private key (store it as the SOPS_AGE_KEY secret in each repository)
    required: true
  cookie-path:
    description: where to write the X session cookies (browser extension JSON format)
    required: false
    default: cookie.json
  sops-version:
    description: sops release to install
    required: false
    default: v3.13.3
outputs:
  cookie-path:
    description: path of the written cookie file
    value: ${{ steps.decrypt.outputs.cookie-path }}
runs:
  using: composite
  steps:
    - name: Install sops
      shell: bash
      run: |
        curl -fsSL -o /usr/local/bin/sops "https://github.com/getsops/sops/releases/download/${{ inputs.sops-version }}/sops-${{ inputs.sops-version }}.linux.amd64"
        chmod +x /usr/local/bin/sops
    - name: Decrypt
      id: decrypt
      shell: bash
      env:
        SOPS_AGE_KEY: ${{ inputs.age-key }}
        SECRETS_FILE: ${{ github.action_path }}/secrets.enc.yaml
      run: |
        sops decrypt --extract '["cookie_json"]' "$SECRETS_FILE" > "${{ inputs.cookie-path }}"
        jq -r '.[].value | select(length >= 8)' "${{ inputs.cookie-path }}" | while read -r value; do echo "::add-mask::$value"; done
        echo "cookie-path=${{ inputs.cookie-path }}" >> "$GITHUB_OUTPUT"
        sops decrypt --extract '["proxy_list"]' "$SECRETS_FILE" > /tmp/proxy_list
        while read -r line; do [ -n "$line" ] && echo "::add-mask::$line"; done < /tmp/proxy_list
        {
          echo "PROXY_LIST<<__EOF__"
          cat /tmp/proxy_list
          echo "__EOF__"
        } >> "$GITHUB_ENV"
        rm /tmp/proxy_list
